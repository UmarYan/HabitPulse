<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#202321"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>HabitHarbor</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div><p class="eyebrow">YOUR DAILY COMPANION</p><h1>HabitHarbor <span>•</span></h1></div>
  <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">◐</button>
</header>
<nav class="tabs" aria-label="Main navigation">
<button class="tab active" data-view="habits">Habits</button><button class="tab" data-view="routines">Routines</button><button class="tab" data-view="stats">Stats</button>
</nav>
<main id="app"></main>
<button id="settingsBtn" class="settings icon-btn" aria-label="Settings">⚙</button>
<dialog id="editor"><form method="dialog" id="editorForm"><header class="dialog-head"><h2 id="dialogTitle">New habit</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></header><div id="dialogFields"></div><footer><button class="btn quiet" value="cancel">Cancel</button><button class="btn primary" id="saveBtn" value="default">Save</button></footer></form></dialog>
<dialog id="settings"><form method="dialog"><header class="dialog-head"><h2>Settings & backup</h2><button class="icon-btn" value="cancel">×</button></header><p class="muted">Your information is stored on this device.</p><div class="settings-actions"><button type="button" id="exportBtn" class="btn">Export backup</button><label class="btn">Import backup<input id="importInput" type="file" accept="application/json" hidden></label><button type="button" id="clearBtn" class="btn danger">Clear all data</button></div><footer><button class="btn primary" value="cancel">Done</button></footer></form></dialog>
<script src="app.js"></script>
</body></html>
